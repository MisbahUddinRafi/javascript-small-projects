<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1 id="heading">Currency Converter</h1>

    <div id="container">
        <!-- input amount -->
        <label for="amount-input" id="amountLabel">Enter Amount</label>
        <input type="number" placeholder="Enter amount" id="amount-input" value="1">

        <!-- currency selection -->
        <div id="dropdowns">
            <!-- from currency -->
            <div class="inputs">
                <p>From Currency</p>
                <img src="" id="from-flag" alt="from-flag" class="flag">

                <input type="text" placeholder="from currency" list="from-list" class="curr-input" id="from-input"
                    autocomplete="off" />

                <datalist class="curr-list" id="from-list"></datalist>
            </div>

            <!-- to currency -->
            <div class="inputs">
                <p>To Currency</p>
                <img src="" id="to-flag" alt="to-flag" class="flag">

                <input type="text" placeholder="to currency" list="to-list" class="curr-input" id="to-input"
                    autocomplete="off" />

                <datalist class="curr-list" id="to-list"></datalist>
            </div>

        </div>

        <!-- output section -->
        <div id="outputs-div">
            <p id="result">result</p>
            <button id="btn">convert</button>
        </div>
    </div>

    <script type="module" src="app.js"></script>
    <script src="countryCodes.js"></script>

</body>

</html>
